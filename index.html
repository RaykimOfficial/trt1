<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRT 1 Canlı</title>

  <script src="hls.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #playerWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;

      max-width: 500px;
      padding: 14px 18px;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      border-radius: 10px;
      font-size: 16px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-word;

      transition: opacity 0.25s ease;
    }

    #status.success {
      background: rgba(0, 120, 40, 0.9);
    }

    #status.error {
      background: rgba(180, 0, 0, 0.95);
    }

    #status.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="playerWrapper">

  <div id="status">
    Yayın hazırlanıyor...
  </div>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline
  ></video>

</div>

<script>
  const video = document.getElementById("video");
  const statusBox = document.getElementById("status");

  const streamUrl = "/trt/master_720.m3u8";

  let yayinBasladi = false;
  let hideTimer = null;


  function showStatus(message, type = "", force = false) {

    // Yayın başladıktan sonra normal bilgi mesajlarını gösterme
    if (yayinBasladi && !force && type !== "error") {
      return;
    }

    clearTimeout(hideTimer);

    statusBox.textContent = message;
    statusBox.className = type;

    console.log(message);
  }


  function hideStatus(delay = 1200) {

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {
      statusBox.classList.add("hidden");
    }, delay);
  }


  async function playVideo() {

    try {

      await video.play();

    } catch (error) {

      console.error("PLAY ERROR:", error);

      showStatus(
        "Video yüklendi fakat otomatik oynatma başlatılamadı.\nPlay tuşuna bas.",
        "error",
        true
      );
    }
  }


  function start() {

    if (typeof Hls === "undefined") {

      showStatus(
        "HATA: HLS.JS yüklenemedi.",
        "error",
        true
      );

      return;
    }


    if (Hls.isSupported()) {

      showStatus(
        "TRT 1 yayınına bağlanılıyor..."
      );


      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });


      window.hls = hls;


      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          showStatus(
            "Yayın listesi yükleniyor..."
          );

          hls.loadSource(streamUrl);

        }
      );


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          showStatus(
            "Yayın bulundu. Video başlatılıyor...",
            "success"
          );

          playVideo();

        }
      );


      hls.on(
        Hls.Events.FRAG_LOADING,
        function (event, data) {

          console.log(
            "Segment yükleniyor:",
            data.frag.url
          );

        }
      );


      hls.on(
        Hls.Events.FRAG_LOADED,
        function (event, data) {

          console.log(
            "Segment geldi:",
            data.frag.url
          );

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.error(
            "HLS ERROR:",
            data
          );


          let message =
            "Yayın hatası\n\n" +
            "Detay: " +
            data.details;


          if (data.response?.code) {
            message +=
              "\nHTTP: " +
              data.response.code;
          }


          if (data.response?.url) {
            message +=
              "\nURL: " +
              data.response.url;
          }


          showStatus(
            message,
            "error",
            true
          );


          if (data.fatal) {

            if (
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {

              setTimeout(() => {
                hls.startLoad();
              }, 2000);

            }

            else if (
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ) {

              hls.recoverMediaError();

            }

            else {

              hls.destroy();

            }
          }

        }
      );


      hls.attachMedia(video);

    }

    else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = streamUrl;

      video.addEventListener(
        "loadedmetadata",
        playVideo,
        { once: true }
      );

    }

    else {

      showStatus(
        "Bu ortam HLS desteklemiyor.",
        "error",
        true
      );

    }

  }


  video.addEventListener(
    "playing",
    function () {

      console.log("VIDEO PLAYING");

      yayinBasladi = true;

      showStatus(
        "TRT 1 canlı yayın oynuyor.",
        "success",
        true
      );

      hideStatus(1200);

    }
  );


  video.addEventListener(
    "waiting",
    function () {

      console.log("VIDEO WAITING");

      // Buffer sırasında yazı göstermiyoruz.
      // Yayın görüntüsü kesilip geri gelirse kutu ekranda zıplamaz.

    }
  );


  video.addEventListener(
    "error",
    function () {

      console.error(
        "VIDEO ERROR:",
        video.error
      );

      if (!video.error) {
        return;
      }


      showStatus(
        "Video hatası\n\n" +
        "Kod: " +
        video.error.code +
        "\nMesaj: " +
        video.error.message,
        "error",
        true
      );

    }
  );


  start();

</script>

</body>
</html>
