<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRT 1 Canlı</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 15px;
      border-radius: 8px;
      z-index: 9999;
      white-space: pre-wrap;
    }

    #status.success {
      background: rgba(0, 120, 40, 0.9);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.9);
    }
  </style>
</head>

<body>

  <div id="status">Yayın yükleniyor...</div>

  <video
    id="video"
    controls
    autoplay
    muted
    playsinline
  ></video>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");

    // Discord URL Mapping:
    // /trt -> tv-trt1.medya.trt.com.tr
    const streamUrl = "/trt/master_720.m3u8";

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
      console.log(text);
    }

    async function startPlayback() {
      try {
        await video.play();

        setStatus(
          "TRT 1 canlı yayın oynuyor.",
          "success"
        );

        setTimeout(() => {
          status.style.display = "none";
        }, 2000);

      } catch (err) {
        console.error(err);

        setStatus(
          "Yayın yüklendi fakat otomatik oynatma engellendi.\n" +
          "Play tuşuna basmayı dene.",
          "error"
        );
      }
    }

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });

      window.hls = hls;

      setStatus("TRT 1 yayınına bağlanılıyor...");

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus(
          "Yayın listesi alındı. Video başlatılıyor...",
          "success"
        );

        startPlayback();
      });

      hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
        console.log(
          "Video parçası geldi:",
          data.frag.url
        );
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error("HLS HATASI:", data);

        let message =
          "Yayın hatası\n\nDetay: " +
          data.details;

        if (data.response?.code) {
          message +=
            "\nHTTP: " +
            data.response.code;
        }

        if (data.response?.url) {
          message +=
            "\nURL: " +
            data.response.url;
        }

        setStatus(
          message,
          "error"
        );

        if (!data.fatal) {
          return;
        }

        if (
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR
        ) {
          hls.startLoad();
        }

        else if (
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR
        ) {
          hls.recoverMediaError();
        }

        else {
          hls.destroy();
        }
      });

    } else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {
      video.src = streamUrl;

      video.addEventListener(
        "loadedmetadata",
        startPlayback,
        { once: true }
      );

    } else {
      setStatus(
        "Bu ortam HLS yayınını desteklemiyor.",
        "error"
      );
    }
  </script>

</body>
</html>
