<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>TRT Test</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 30px;
      font-size: 22px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="sonuc">Test başlıyor...</div>

<script>
const sonuc = document.getElementById("sonuc");

async function testEt() {

  const url = "/trt/master_720.m3u8";

  sonuc.textContent =
    "TRT yayınına bağlanmaya çalışıyorum...\n\n" +
    url;

  try {

    const cevap = await fetch(url);

    sonuc.textContent =
      "HTTP KODU: " + cevap.status +
      "\n\n";

    const yazi = await cevap.text();

    sonuc.textContent +=
      "GELEN CEVAP:\n\n" +
      yazi.substring(0, 2000);

  }

  catch (hata) {

    sonuc.textContent =
      "HATA OLDU\n\n" +
      hata.message;

  }
}

testEt();
</script>

</body>
</html>
