<!DOCTYPE html>

<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT 1 Canlı</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #ses-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      background: rgba(0, 0, 0, 0.8);
      color: white;

      border: 2px solid white;
      padding: 14px 28px;

      font-size: 18px;
      border-radius: 10px;

      cursor: pointer;
      z-index: 20;

      display: none;
    }

    #durum {
      position: absolute;
      top: 10px;
      left: 10px;

      color: white;

      font-family: monospace;
      font-size: 12px;

      background: rgba(0, 0, 0, 0.8);

      padding: 6px 10px;
      border-radius: 4px;

      z-index: 30;

      max-width: 90%;

      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

</head>

<body>

<video
 id="video"
 controls
 autoplay
 muted
 playsinline> </video>

  <button id="ses-btn">
    🔊 Sesi Aç
  </button>

  <div id="durum">
    Yükleniyor...
  </div>

  <!-- HLS.JS -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>

    const video = document.getElementById("video");
    const sesBtn = document.getElementById("ses-btn");
    const durum = document.getElementById("durum");


    /*
     * TRT 1 CANLI YAYIN
     *
     * BUNA DOKUNMADIM.
     */

    const streamUrl =
      "https://tv-trt1.medya.trt.com.tr/master_720.m3u8";


    /*
     * SES AÇ
     */

    function sesiAc() {

      video.muted = false;
      video.volume = 1;

      video.play()
        .then(function () {

          sesBtn.style.display = "none";

        })
        .catch(function (error) {

          console.error(
            "Ses açılamadı:",
            error
          );

        });

    }

    sesBtn.addEventListener(
      "click",
      sesiAc
    );


    /*
     * HLS AYARLARI
     */

    const hlsConfig = {

      debug: false,

      enableWorker: false,

      lowLatencyMode: false,

      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,

      levelLoadingTimeOut: 20000,
      levelLoadingMaxRetry: 4,

      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 4,

      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,

      xhrSetup: function (xhr) {

        xhr.withCredentials = false;

      }

    };


    /*
     * HLS.JS DESTEKLENİYORSA
     */

    if (Hls.isSupported()) {

      const hls = new Hls(hlsConfig);


      /*
       * ÖNEMLİ:
       * İlk çalışan kodundaki sırayı kullanıyoruz.
       */

      hls.loadSource(streamUrl);

      hls.attachMedia(video);


      /*
       * MANIFEST
       */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          durum.textContent =
            "Manifest yüklendi, oynatılıyor...";


          video.play()
            .then(function () {

              /*
               * Otomatik ses Discord tarafından
               * engellenebilir.
               */

              setTimeout(function () {

                if (video.muted) {

                  sesBtn.style.display = "block";

                }

              }, 500);

            })
            .catch(function (error) {

              console.error(
                "Oynatma hatası:",
                error
              );


              durum.textContent =
                "Oynatma hatası: " +
                error.message;


              sesBtn.style.display = "block";

            });

        }
      );


      /*
       * HLS HATALARI
       */

      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.error(
            "HLS Hatası:",
            data
          );


          const hataMesaji =
            "HLS HATASI\n" +

            "Tür: " +
            data.type +

            "\nDetay: " +
            data.details +

            "\nÖlümcül: " +
            data.fatal +

            "\nYanıt: " +
            (
              data.response
                ? data.response.code
                : "yok"
            ) +

            "\nURL: " +
            (
              data.url
                ? data.url.substring(0, 200)
                : "yok"
            );


          durum.textContent =
            hataMesaji;


          /*
           * NETWORK ERROR
           */

          if (
            data.fatal &&
            data.type ===
            Hls.ErrorTypes.NETWORK_ERROR
          ) {

            durum.textContent +=
              "\n\nAğ hatası, tekrar deneniyor...";

            hls.startLoad();

            return;

          }


          /*
           * MEDIA ERROR
           */

          if (
            data.fatal &&
            data.type ===
            Hls.ErrorTypes.MEDIA_ERROR
          ) {

            durum.textContent +=
              "\n\nMedya hatası, kurtarılıyor...";

            hls.recoverMediaError();

            return;

          }


          /*
           * KRİTİK HATA
           */

          if (data.fatal) {

            durum.textContent +=
              "\n\nKritik hata.";

            hls.destroy();

          }

        }
      );


      /*
       * VIDEO OYNUYOR
       */

      video.addEventListener(
        "playing",
        function () {

          durum.textContent =
            "🔴 TRT 1 CANLI";

        }
      );


      /*
       * BEKLEME
       */

      video.addEventListener(
        "waiting",
        function () {

          durum.textContent =
            "TRT 1 yayını yükleniyor...";

        }
      );


    /*
     * NATIVE HLS
     */

    } else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = streamUrl;


      video.addEventListener(
        "loadedmetadata",
        function () {

          video.play()
            .then(function () {

              durum.textContent =
                "🔴 TRT 1 CANLI";

            })
            .catch(function (error) {

              durum.textContent =
                "Oynatma hatası: " +
                error.message;

              sesBtn.style.display = "block";

            });

        }
      );


    /*
     * HLS YOK
     */

    } else {

      durum.textContent =
        "Tarayıcınız HLS desteklemiyor.";

    }

  </script>

</body>
</html>
