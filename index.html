<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT 1 Canlı</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #ses-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75); color: white; border: 2px solid white;
      padding: 14px 28px; font-size: 18px; border-radius: 10px; cursor: pointer;
      z-index: 20; display: none;
    }
    #durum {
      position: absolute; top: 10px; left: 10px; color: #fff;
      font-family: monospace; font-size: 12px;
      background: rgba(0,0,0,0.8); padding: 6px 10px;
      border-radius: 4px; z-index: 30; max-width: 90%;
      white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <button id="ses-btn">🔊 Sesi Aç</button>
  <div id="durum">Yükleniyor...</div>

  <script>
    // ---- Service Worker Kaydı (Discord proxy yönlendirmesi için) ----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/mac/sw.js')
        .then(reg => console.log('SW kaydedildi:', reg.scope))
        .catch(err => console.error('SW hatası:', err));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const sesBtn = document.getElementById('ses-btn');
    const durum = document.getElementById('durum');

    // Discord URL Eşlemesi: /trt -> raykimofficial.github.io/trt1/
    const streamUrl = "https://tv-trt1.medya.trt.com.tr/master_720.m3u8";

    function sesiAc() {
      video.muted = false;
      video.volume = 1;
      sesBtn.style.display = 'none';
    }
    sesBtn.addEventListener('click', sesiAc);

    const hlsConfig = {
      debug: true,
      enableWorker: false,
      lowLatencyMode: false,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,
      levelLoadingTimeOut: 20000,
      levelLoadingMaxRetry: 4,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 4,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,
      xhrSetup: function (xhr) {
        xhr.withCredentials = false;
      }
    };

    if (Hls.isSupported()) {
      const hls = new Hls(hlsConfig);
      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        durum.textContent = "Manifest yüklendi, oynatılıyor...";
        video.play().then(() => {
          setTimeout(() => {
            video.muted = false;
            video.volume = 1;
            if (video.muted) sesBtn.style.display = 'block';
          }, 500);
        }).catch((e) => {
          durum.textContent = "Oynatma hatası: " + e.message;
          sesBtn.style.display = 'block';
        });
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        console.error("HLS Hatası:", data);
        const hataMesaji = `Tür: ${data.type}\nDetay: ${data.details}\nÖlümcül: ${data.fatal}\nYanıt: ${data.response ? data.response.code : 'yok'}\nURL: ${data.url ? data.url.substring(0, 120) : 'yok'}`;
        durum.textContent = hataMesaji;

        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              durum.textContent += "\n\nAğ hatası, tekrar deneniyor...";
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              durum.textContent += "\n\nMedya hatası, kurtarılıyor...";
              hls.recoverMediaError();
              break;
            default:
              durum.textContent += "\n\nKritik hata, yeniden başlatılıyor...";
              hls.destroy();
              break;
          }
        }
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.play().then(() => {
        video.muted = false; video.volume = 1;
        durum.textContent = "Oynatılıyor...";
      }).catch(() => { sesBtn.style.display = 'block'; });
    } else {
      durum.textContent = "Tarayıcı desteklemiyor.";
      alert("Tarayıcınız bu yayını desteklemiyor.");
    }
  </script>
</body>
</html>
