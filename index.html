<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRT 1</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #test {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div id="test">
    Discord Activity sayfası yükleniyor...
</div>

<script>

    const worker =
        "https://royal-sun-393f.raykimofficial.workers.dev/";

    document.getElementById("test").innerHTML =
        "HTML ÇALIŞIYOR<br><br>" +
        "Worker kontrol ediliyor...";


    fetch(worker, {
        method: "GET",
        mode: "cors",
        credentials: "omit"
    })
    .then(function(response) {

        console.log("Worker HTTP:", response.status);

        return response.text();

    })
    .then(function(text) {

        console.log("Worker cevabı:", text);

        if (text.includes("#EXTM3U")) {

            document.getElementById("test").innerHTML =
                "HTML ÇALIŞIYOR<br>" +
                "CLOUDFLARE WORKER ÇALIŞIYOR<br><br>" +
                "HLS MANIFEST ALINDI";

        } else {

            document.getElementById("test").innerHTML =
                "HTML ÇALIŞIYOR<br>" +
                "Worker cevap verdi<br><br>" +
                "AMA HLS MANIFEST BULUNAMADI";

        }

    })
    .catch(function(error) {

        console.error(error);

        document.getElementById("test").innerHTML =
            "HTML ÇALIŞIYOR<br><br>" +
            "WORKER'A ERİŞİLEMİYOR<br><br>" +
            error;

    });

</script>

</body>
</html>
