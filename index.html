<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRT 1 Canlı Yayın</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 9999;

      max-width: 420px;

      padding: 14px 16px;

      background: rgba(0, 0, 0, 0.78);
      color: #fff;

      border-radius: 10px;

      font-size: 14px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-word;
    }

    #status.success {
      background: rgba(0, 120, 40, 0.88);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.9);
    }
  </style>
</head>

<body>

  <div class="player-wrapper">

    <div id="status">
      Yayın hazırlanıyor...
    </div>

    <video
      id="video"
      controls
      autoplay
      muted
      playsinline
    ></video>

  </div>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");

    // Gerçek TRT yayını
    const DIRECT_STREAM =
      "https://tv-trt1.medya.trt.com.tr/master_720.m3u8";

    // Discord Activity URL Mapping yolu
    const DISCORD_PROXY_STREAM =
      "/.proxy/trt/master_720.m3u8";


    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = type;

      console.log("[STATUS]", message);
    }


    function isDiscordActivity() {
      const hostname = window.location.hostname;
      const pathname = window.location.pathname;

      console.log("Hostname:", hostname);
      console.log("Pathname:", pathname);

      return (
        hostname.includes("discordsays.com") ||
        hostname.includes("discord.com") ||
        pathname.includes("/.proxy")
      );
    }


    const runningInDiscord = isDiscordActivity();

    const streamUrl = runningInDiscord
      ? DISCORD_PROXY_STREAM
      : DIRECT_STREAM;


    console.log(
      "Ortam:",
      runningInDiscord
        ? "Discord Activity"
        : "Normal tarayıcı"
    );

    console.log(
      "Kullanılan yayın URL:",
      streamUrl
    );


    async function playVideo() {

      try {

        await video.play();

        setStatus(
          "Yayın oynatılıyor.",
          "success"
        );

        setTimeout(() => {
          statusBox.style.display = "none";
        }, 2500);

      } catch (error) {

        console.error(
          "PLAY ERROR:",
          error
        );

        setStatus(
          "Yayın yüklendi fakat otomatik oynatma engellendi.\n\n" +
          error.message,
          "error"
        );

      }

    }


    function startPlayer() {

      setStatus(
        runningInDiscord
          ? "Discord Activity algılandı.\nYayın yükleniyor..."
          : "Normal tarayıcı algılandı.\nYayın yükleniyor..."
      );


      // Chrome / Edge / Discord gibi ortamlarda
      if (Hls.isSupported()) {

        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30
        });

        window.hls = hls;


        hls.on(
          Hls.Events.MEDIA_ATTACHED,
          () => {

            console.log(
              "Video elementi HLS'e bağlandı."
            );

            setStatus(
              "Video hazır.\nYayın listesi yükleniyor..."
            );

            hls.loadSource(streamUrl);

          }
        );


        hls.on(
          Hls.Events.MANIFEST_LOADING,
          (event, data) => {

            console.log(
              "Manifest yükleniyor:",
              data
            );

          }
        );


        hls.on(
          Hls.Events.MANIFEST_LOADED,
          (event, data) => {

            console.log(
              "Manifest indirildi:",
              data
            );

          }
        );


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          (event, data) => {

            console.log(
              "Manifest başarıyla işlendi:",
              data
            );

            setStatus(
              "Yayın bulundu.\nVideo başlatılıyor...",
              "success"
            );

            playVideo();

          }
        );


        hls.on(
          Hls.Events.LEVEL_LOADED,
          (event, data) => {

            console.log(
              "Yayın seviyesi yüklendi:",
              data
            );

          }
        );


        hls.on(
          Hls.Events.FRAG_LOADING,
          (event, data) => {

            console.log(
              "Segment yükleniyor:",
              data.frag?.url
            );

          }
        );


        hls.on(
          Hls.Events.FRAG_LOADED,
          (event, data) => {

            console.log(
              "Segment yüklendi:",
              data.frag?.url
            );

          }
        );


        hls.on(
          Hls.Events.ERROR,
          (event, data) => {

            console.error(
              "HLS ERROR:",
              data
            );

            let message =
              "HLS hatası oluştu.";

            if (data.details) {
              message +=
                "\n\nDetay:\n" +
                data.details;
            }

            if (
              data.response &&
              data.response.code
            ) {
              message +=
                "\n\nHTTP kodu:\n" +
                data.response.code;
            }

            if (
              data.response &&
              data.response.url
            ) {
              message +=
                "\n\nURL:\n" +
                data.response.url;
            }

            if (data.url) {
              message +=
                "\n\nKaynak:\n" +
                data.url;
            }

            if (data.fatal) {

              setStatus(
                "KRİTİK YAYIN HATASI\n\n" +
                message,
                "error"
              );


              if (
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
              ) {

                console.warn(
                  "Ağ hatası. Tekrar deneniyor..."
                );

                setTimeout(() => {
                  hls.startLoad();
                }, 2000);

              }

              else if (
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
              ) {

                console.warn(
                  "Medya hatası. Kurtarma deneniyor..."
                );

                hls.recoverMediaError();

              }

              else {

                console.error(
                  "Kurtarılamayan HLS hatası."
                );

                hls.destroy();

              }

            }

            else {

              setStatus(
                message,
                "error"
              );

            }

          }
        );


        hls.attachMedia(video);

        return;
      }


      // Safari gibi native HLS destekleyen tarayıcılar
      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "Native HLS kullanılıyor."
        );

        setStatus(
          "Tarayıcının yerleşik HLS oynatıcısı kullanılıyor..."
        );

        video.src = streamUrl;


        video.addEventListener(
          "loadedmetadata",
          () => {

            setStatus(
              "Yayın yüklendi.\nVideo başlatılıyor...",
              "success"
            );

            playVideo();

          },
          {
            once: true
          }
        );

        return;
      }


      setStatus(
        "Bu tarayıcı HLS yayınını desteklemiyor.",
        "error"
      );

    }


    video.addEventListener(
      "playing",
      () => {

        console.log(
          "VIDEO PLAYING"
        );

        setStatus(
          "TRT 1 canlı yayın oynatılıyor.",
          "success"
        );

        setTimeout(() => {
          statusBox.style.display = "none";
        }, 2000);

      }
    );


    video.addEventListener(
      "waiting",
      () => {

        console.log(
          "Video buffer bekliyor..."
        );

      }
    );


    video.addEventListener(
      "stalled",
      () => {

        console.warn(
          "Video bağlantısı takıldı."
        );

      }
    );


    video.addEventListener(
      "error",
      () => {

        if (!video.error) {
          return;
        }

        console.error(
          "VIDEO ERROR:",
          video.error
        );

        setStatus(
          "Video oynatıcı hata verdi.\n\n" +
          "Kod: " +
          video.error.code +
          "\n\n" +
          "Mesaj: " +
          (
            video.error.message ||
            "Bilinmeyen hata"
          ),
          "error"
        );

      }
    );


    startPlayer();

  </script>

</body>
</html>
