<!DOCTYPE html>

<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT 1 Canlı</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    #ses-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      padding: 14px 28px;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      border: 2px solid white;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
      z-index: 20;

      display: none;
    }

    #durum {
      position: absolute;
      top: 10px;
      left: 10px;

      padding: 7px 10px;

      color: white;
      background: rgba(0, 0, 0, 0.8);

      border-radius: 5px;

      font-family: monospace;
      font-size: 12px;

      max-width: 90%;

      white-space: pre-wrap;
      word-break: break-all;

      z-index: 30;
    }
  </style>

</head>

<body>

<video
 id="video"
 autoplay
 muted
 playsinline
 controls> </video>

  <button id="ses-btn">
    🔊 Sesi Aç
  </button>

  <div id="durum">
    TRT 1 yükleniyor...
  </div>

  <!-- HLS.js -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>

    const video = document.getElementById("video");
    const sesBtn = document.getElementById("ses-btn");
    const durum = document.getElementById("durum");


    /*
     * =====================================================
     * TRT 1 YAYIN ADRESİ
     *
     * PROXY KURDUĞUMUZDA SADECE BU SATIRI DEĞİŞTİRECEĞİZ.
     * =====================================================
     */

    const streamUrl =
      "https://tv-trt1.medya.trt.com.tr/master_720.m3u8";


    /*
     * =====================================================
     * SES
     * =====================================================
     */

    sesBtn.addEventListener("click", function () {

      video.muted = false;
      video.volume = 1;

      video.play()
        .then(function () {

          sesBtn.style.display = "none";

          durum.textContent =
            "🔴 TRT 1 CANLI";

        })
        .catch(function (error) {

          console.error(
            "Ses açılamadı:",
            error
          );

          durum.textContent =
            "Ses açılamadı.";

        });

    });


    /*
     * =====================================================
     * HLS AYARLARI
     * =====================================================
     */

    const hlsConfig = {

      debug: false,

      enableWorker: false,

      lowLatencyMode: false,

      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,

      levelLoadingTimeOut: 20000,
      levelLoadingMaxRetry: 4,

      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 4,

      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,

      xhrSetup: function (xhr) {

        xhr.withCredentials = false;

      }

    };


    /*
     * =====================================================
     * HLS.JS
     * =====================================================
     */

    if (Hls.isSupported()) {

      const hls = new Hls(hlsConfig);


      /*
       * Video bağlandı
       */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          durum.textContent =
            "TRT 1 yayınına bağlanılıyor...";

          hls.loadSource(streamUrl);

        }
      );


      /*
       * Manifest başarıyla geldi
       */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          durum.textContent =
            "Manifest yüklendi.\n" +
            "Yayın başlatılıyor...";


          video.muted = true;


          video.play()
            .then(function () {

              durum.textContent =
                "🔴 TRT 1 CANLI";


              /*
               * Discord otomatik ses oynatmayı
               * engellerse buton göster.
               */

              setTimeout(function () {

                if (video.muted) {

                  sesBtn.style.display = "block";

                }

              }, 500);

            })
            .catch(function (error) {

              console.error(
                "Oynatma hatası:",
                error
              );


              durum.textContent =
                "Oynatma hatası:\n" +
                error.message;


              sesBtn.style.display = "block";

            });

        }
      );


      /*
       * =================================================
       * HLS HATALARI
       * =================================================
       */

      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.error(
            "HLS Hatası:",
            data
          );


          const responseCode =
            data.response &&
            data.response.code
              ? data.response.code
              : "yok";


          const errorUrl =
            data.url
              ? data.url.substring(0, 200)
              : "yok";


          durum.textContent =
            "HLS HATASI\n\n" +

            "Tür: " +
            data.type +

            "\nDetay: " +
            data.details +

            "\nÖlümcül: " +
            data.fatal +

            "\nYanıt: " +
            responseCode +

            "\nURL: " +
            errorUrl;


          /*
           * Ağ hatası
           */

          if (
            data.fatal &&
            data.type === Hls.ErrorTypes.NETWORK_ERROR
          ) {

            durum.textContent +=
              "\n\nAğ hatası.\n" +
              "Yayın yeniden deneniyor...";


            hls.startLoad();

            return;

          }


          /*
           * Medya hatası
           */

          if (
            data.fatal &&
            data.type === Hls.ErrorTypes.MEDIA_ERROR
          ) {

            durum.textContent +=
              "\n\nMedya hatası.\n" +
              "Kurtarılmaya çalışılıyor...";


            hls.recoverMediaError();

            return;

          }


          /*
           * Diğer kritik hatalar
           */

          if (data.fatal) {

            durum.textContent +=
              "\n\nKritik HLS hatası.";

            hls.destroy();

          }

        }
      );


      /*
       * =================================================
       * VIDEO DURUMU
       * =================================================
       */

      video.addEventListener(
        "playing",
        function () {

          durum.textContent =
            "🔴 TRT 1 CANLI";

        }
      );


      video.addEventListener(
        "waiting",
        function () {

          durum.textContent =
            "TRT 1 yayını yükleniyor...";

        }
      );


      video.addEventListener(
        "stalled",
        function () {

          durum.textContent =
            "Yayın bağlantısı bekleniyor...";

        }
      );


      video.addEventListener(
        "error",
        function () {

          console.error(
            "Video hatası:",
            video.error
          );

        }
      );


    /*
     * =====================================================
     * NATIVE HLS
     * =====================================================
     */

    } else if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      durum.textContent =
        "Native HLS kullanılıyor...";


      video.src = streamUrl;


      video.addEventListener(
        "loadedmetadata",
        function () {

          video.play()
            .then(function () {

              durum.textContent =
                "🔴 TRT 1 CANLI";


              if (video.muted) {

                sesBtn.style.display = "block";

              }

            })
            .catch(function (error) {

              durum.textContent =
                "Oynatma hatası:\n" +
                error.message;


              sesBtn.style.display = "block";

            });

        }
      );


    /*
     * =====================================================
     * HLS DESTEKLENMİYOR
     * =====================================================
     */

    } else {

      durum.textContent =
        "Bu tarayıcı HLS yayınlarını desteklemiyor.";

    }

  </script>

</body>
</html>
