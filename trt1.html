<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRT 1 Canlı</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const streamUrl = "https://tv-trt1.medya.trt.com.tr/master.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(() => {
          console.log("Otomatik oynatma engellendi, kullanıcı tıklayınca başlar");
        });
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari için
      video.src = streamUrl;
      video.play();
    } else {
      alert("Tarayıcınız bu yayını desteklemiyor.");
    }
  </script>
</body>
</html>
